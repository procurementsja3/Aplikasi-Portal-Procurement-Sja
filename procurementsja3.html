    <script type="text/babel" data-type="module">
        import React, { useState, useMemo, useEffect, useRef } from 'https://esm.sh/react@18.2.0';
        import { createRoot } from 'https://esm.sh/react-dom@18.2.0/client';
        import { BarChart, Bar, XAxis, YAxis, CartesianGrid, Tooltip as RechartsTooltip, Legend, ResponsiveContainer, PieChart, Pie, Cell, ComposedChart, Line } from 'https://esm.sh/recharts@2.12.2?deps=react@18.2.0,react-dom@18.2.0';
        import { 
          Trophy, TrendingDown, DollarSign, Calendar, Package, FileText, 
          LayoutDashboard, Database, Menu, X, Briefcase, PlusCircle, CheckCircle2,
          Trash2, Plus, Users, ShieldCheck, Loader2, FolderOpen,
          FolderSearch, Edit, AlertTriangle, Download, Upload, Search, ChevronLeft, 
          ChevronRight, PieChart as PieChartIcon, FileClock, ShoppingCart, 
          LogOut, ChevronDown, ChevronUp, Droplet, Layers, Truck, Activity, Files, BookOpen,
          Eye, ClipboardList, Mountain, Printer, ArrowUpDown, ArrowDown, ArrowUp, Archive, RefreshCw, ExternalLink, Image as ImageIcon, Wrench, Coffee, Filter, Copy, Check, SlidersHorizontal, Clock,
          Sun, Moon
        } from 'https://esm.sh/lucide-react@0.344.0?deps=react@18.2.0';
        
        // Menggunakan Firebase resmi dari Gstatic untuk mencegah error registrasi modul
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js';
        import { getAuth, signInAnonymously, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js';
        import { getFirestore, initializeFirestore, setLogLevel, doc, setDoc, deleteDoc, onSnapshot, collection } from 'https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js';

        // --- KONFIGURASI FIREBASE ASLI SJA3 ---
        const firebaseConfig = {
          apiKey: "AIzaSyCE9ZUP0_1v13Wsbklj2gw7S3UCbYnzcxE",
          authDomain: "portal-procurement-sja3.firebaseapp.com",
          projectId: "portal-procurement-sja3",
          storageBucket: "portal-procurement-sja3.firebasestorage.app",
          messagingSenderId: "801722194288",
          appId: "1:801722194288:web:7e5e147982313f68a157b5",
          measurementId: "G-KBQYK906MV"
        };
        
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        // Inisialisasi Firestore dengan opsi long polling agar tahan terhadap kendala koneksi proxy/iframe/backend
        let db;
        try {
          db = initializeFirestore(app, {
            experimentalForceLongPolling: true,
          });
        } catch (e) {
          db = getFirestore(app);
        }

        try {
          setLogLevel('error');
        } catch (e) {}

        const safeAppId = "portal_procurement_sja"; // Hardcoded safe ID for collection path
        const isDummyFirebase = false; // Menggunakan Firebase SJA3 Asli

        // Konstanta Konfigurasi Aplikasi
        const UNIT_OPTIONS = ["Pcs", "Unit", "Set", "LOT", "Lembar", "Lonjor", "Meter", "Kilogram", "Lainnya"];
        const TIME_UNITS = ["Hari", "Minggu", "Bulan", "Tahun"];
        const COLORS = ['#2563eb', '#10b981', '#f59e0b', '#ef4444', '#8b5cf6', '#06b6d4', '#ec4899', '#14b8a6', '#f43f5e', '#a855f7'];
        const SPEND_SAVING_COLORS = ['#3b82f6', '#10b981']; 
        const HISTORI_PER_PAGE = 10;
        const RADIAN = Math.PI / 180;

        const formatCurrency = (amount) => {
          return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0, maximumFractionDigits: 0 }).format(amount || 0);
        };

        const formatMonthDisplay = (yyyyMm) => {
          if (yyyyMm === 'all') return 'Semua Bulan';
          const [year, month] = yyyyMm.split('-');
          const date = new Date(year, parseInt(month) - 1);
          return date.toLocaleDateString('id-ID', { month: 'long' });
        };

        const formatDateDisplay = (dateString) => {
          try {
            const date = new Date(dateString);
            return date.toLocaleDateString('id-ID', { day: '2-digit', month: 'short', year: 'numeric' });
          } catch {
            return dateString;
          }
        };

        const getProjectKey = (item) => {
          if (!item) return 'proj_unknown';
          if (item.submissionId) return String(item.submissionId);
          if (item.timestamp) {
            const req = (item.reqNumber && item.reqNumber !== '-' && item.reqNumber !== 'NO-REQ') ? item.reqNumber : '';
            return `sub_${req}_${item.projectName || 'Tanpa Nama Project'}_${item.timestamp}`;
          }
          if (item.reqNumber && item.reqNumber !== '-' && item.reqNumber !== 'NO-REQ') {
            return `req_${item.reqNumber}_${item.projectName || 'Tanpa Nama Project'}_${item.date || ''}`;
          }
          return `item_${item.id || Math.random()}`;
        };

        const renderCustomizedLabel = ({ cx, cy, midAngle, innerRadius, outerRadius, percent, name, payload }) => {
            const radius = innerRadius + (outerRadius - innerRadius) * 0.5;
            const x = cx + radius * Math.cos(-midAngle * RADIAN); const y = cy + radius * Math.sin(-midAngle * RADIAN);
            if (percent < 0.03) return null; 
            const shortName = (name || (payload && payload.name) || 'Unknown').substring(0, 15) + '...';
            return (
               <text x={x} y={y} fill="white" textAnchor="middle" dominantBaseline="central" fontSize="11" fontWeight="bold" style={{ textShadow: '1px 2px 4px rgba(0,0,0,0.8)' }}>
                  {`${(percent * 100).toFixed(1)}%`}
                  <tspan x={x} y={y + 14} fontSize="9" fill="rgba(255,255,255,0.8)">{shortName}</tspan>
               </text>
            );
        };

        const Custom3DBar = (props) => {
            const { fill, x, y, width, height, index } = props;
            if (!height || height <= 0 || isNaN(height)) return null;

            // True 30-degree isometric ratio (2:1 projection)
            const depthX = Math.round(Math.min(16, Math.max(9, width * 0.38)));
            const depthY = Math.round(depthX * 0.52);

            const barId = `3d-bar-${index !== undefined ? index : 0}-${Math.round(x || 0)}`;
            const isEmerald = fill === '#10b981' || (typeof fill === 'string' && (fill.includes('10b981') || fill.includes('emerald') || fill.includes('059669')));

            const colors = isEmerald ? {

                  strokeWidth="1.2"

                {/* 3. Right Extruded Side Wall (3D Shadow Facet) */}

                  points={`${x + width},${y} ${x + width + depthX},${y - depthY} ${x + width + depthX},${y + height - depthY} ${x + width},${y + height}`}

                  strokeWidth="0.5"

                  y2={y + height}
                  stroke="rgba(0,0,0,0.2)"

                />

        const Isometric3DPieChart = ({ spendValue = 0, savingValue = 0, hoveredKey, onHoverKey, formatCurrency }) => {
          const [internalHover, setInternalHover] = useState(null);
          const activeHover = hoveredKey !== undefined ? hoveredKey : internalHover;
          const setHover = (key) => {
            if (onHoverKey) onHoverKey(key);

          };

          const total = spendValue + savingValue;
          if (total <= 0) {
            return (
              <div className="flex flex-col items-center justify-center h-52 text-slate-400 font-medium text-xs">
                <PieChartIcon className="w-8 h-8 mb-2 opacity-40 text-slate-300" />
                Belum ada data anggaran
              </div>
            );

          const spendRatio = spendValue / total;
          const savingRatio = savingValue / total;
          const spendPercent = (spendRatio * 100).toFixed(1);
          const savingPercent = (savingRatio * 100).toFixed(1);

          // Center & radii for 3D Isometric View
          const cx = 200;
          const cy = 100;
          const rx = 105;
          const ry = 48; // isometric tilt squish
          const depth = 22; // 3D extrusion height

          // Circular 3D Pedestal Base (Plinth) as seen in reference photo
          const baseRx = 138;
          const baseRy = 62;
          const baseCy = cy + 24;

          // Slices angles: Saving is centered in the front-right at ~52 deg (0.9 rad)

          const savingCenterAngle = 0.92;
          const savingStart = savingCenterAngle - savingSpan / 2;
          const savingEnd = savingCenterAngle + savingSpan / 2;

          // Explode offsets
          const isSavingHovered = activeHover === 'saving';
          const isSpendHovered = activeHover === 'spend';

          const savingExplode = isSavingHovered ? 20 : 12;
          const spendExplode = isSpendHovered ? 8 : 4;

          const sgDx = Math.cos(savingCenterAngle) * savingExplode;
          const sgDy = Math.sin(savingCenterAngle) * savingExplode * (ry / rx);
          const centerSaving = { x: cx + sgDx, y: cy + sgDy };

          const spendCenterAngle = savingCenterAngle + Math.PI;
          const spDx = Math.cos(spendCenterAngle) * spendExplode;
          const spDy = Math.sin(spendCenterAngle) * spendExplode * (ry / rx);
          const centerSpend = { x: cx + spDx, y: cy + spDy };

          });

                  {/* 3D Emerald Shading Gradients (Total Saving Cost) */}
                  <linearGradient id="green-top-face-grad" x1="0%" y1="0%" x2="100%" y2="100%">

                  <linearGradient id="green-wall-cylinder" x1="0%" y1="0%" x2="100%" y2="0%">

                  <linearGradient id="green-wall-cut-left" x1="0%" y1="0%" x2="100%" y2="50%">

                  {/* Specular Lighting & Gloss Effect */}
                  <linearGradient id="gloss-reflection" x1="0%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" stopColor="#ffffff" stopOpacity="0.45" />

                    <stop offset="100%" stopColor="#ffffff" stopOpacity="0" />
                  </linearGradient>
                </defs>

                {/* 1. 3D CIRCULAR PEDESTAL BASE (Foto 2) */}
                <g filter="url(#pedestal-ground-shadow)" className="pointer-events-none">
                  {/* Pedestal Side Cylinder Wall */}
                  <path
                    d={`M ${cx + baseRx} ${baseCy} A ${baseRx} ${baseRy} 0 0 1 ${cx - baseRx} ${baseCy} L ${cx - baseRx} ${baseCy + baseDepth} A ${baseRx} ${baseRy} 0 0 0 ${cx + baseRx} ${baseCy + baseDepth} Z`}
                    fill="url(#pedestal-wall-grad)"
                  />

                  <path

                  {/* Pedestal Top Elliptical Stage */}

                  <path

                  <circle cx={pinSaving.x} cy={pinSaving.y} r="3.5" fill="#ffffff" stroke="#059669" strokeWidth="2" />
                </g>

                {/* 5. CALLOUT BADGES (Foto 2 Model) */}
                {/* Badge Left: Total Pengeluaran */}
                <g

        const Isometric3DCategoryDonut = ({ data = [], formatCurrency, colors = COLORS }) => {
          const [hoveredIdx, setHoveredIdx] = useState(null);

          const grandTotal = useMemo(() => data.reduce((acc, curr) => acc + (Number(curr.value) || 0), 0), [data]);

          if (!data || data.length === 0 || grandTotal <= 0) {
            return (
              <div className="flex flex-col items-center justify-center h-80 text-slate-400 font-medium text-sm">
                <PieChartIcon className="w-10 h-10 mb-2 opacity-30 text-slate-300 dark:text-slate-600" />
                Tidak ada data distribusi kategori
              </div>
            );
          }

          // Top 6 categories + group minor remainder into "Kategori Lainnya" for clean 3D geometry
          const processedSlices = useMemo(() => {
            const TOP_LIMIT = 6;
            let list = [];
            if (data.length <= TOP_LIMIT) {
              list = data.map((d, i) => ({ ...d, originalIndex: i }));
            } else {
              const top = data.slice(0, TOP_LIMIT).map((d, i) => ({ ...d, originalIndex: i }));
              const othersValue = data.slice(TOP_LIMIT).reduce((sum, item) => sum + (Number(item.value) || 0), 0);
              if (othersValue > 0) {
                top.push({ name: 'Kategori Lainnya', value: othersValue, originalIndex: TOP_LIMIT });
              }
              list = top;
            }

            let startAngle = -Math.PI / 2; // start from top (12 o'clock)
            return list.map((item, idx) => {
              const fraction = item.value / grandTotal;
              const percent = Number((fraction * 100).toFixed(1));
              const angleSpan = Math.max(0.06, fraction * 2 * Math.PI);
              const a1 = startAngle;
              const a2 = startAngle + angleSpan;
              startAngle = a2;
              const amid = (a1 + a2) / 2;
              const color = colors[idx % colors.length];

              return {
                ...item,
                index: idx,
                fraction,
                percent,
                a1,
                a2,
                amid,
                color
              };
            });
          }, [data, grandTotal, colors]);

          // Dimensions for 3D Isometric View
          const cx = 205;
          const cy = 135;
          const rx = 130;
          const ry = 60; // isometric tilt squish
          const irx = 65; // inner hole rx
          const iry = 30; // inner hole ry
          const depth = 25; // 3D extrusion depth

          // Pedestal Base plinth
          const baseRx = 175;
          const baseRy = 82;
          const baseCy = cy + 28;
          const baseDepth = 14;

          const hoveredItem = hoveredIdx !== null ? processedSlices.find(s => s.index === hoveredIdx) : null;

          // Painter's algorithm sort for 3D rendering order (back to front by sin(amid))
          const sortedSlices = useMemo(() => {
            return [...processedSlices].sort((a, b) => {
              if (a.index === hoveredIdx) return 1;
              if (b.index === hoveredIdx) return -1;
              return Math.sin(a.amid) - Math.sin(b.amid);
            });
          }, [processedSlices, hoveredIdx]);

          return (
            <div className="flex flex-col xl:flex-row items-center justify-between gap-6 w-full py-2">
              {/* 3D Isometric Canvas */}
              <div className="relative w-full xl:w-[58%] flex items-center justify-center select-none min-h-[300px]">
                <svg
                  viewBox="0 0 410 300"
                  className="w-full max-w-[430px] h-auto overflow-visible filter drop-shadow-[0_12px_24px_rgba(0,0,0,0.08)] dark:drop-shadow-[0_12px_30px_rgba(0,0,0,0.45)]"
                >
                  <defs>
                    <filter id="iso-soft-shadow" x="-30%" y="-30%" width="160%" height="160%">
                      <feDropShadow dx="0" dy="16" stdDeviation="12" floodColor="#0f172a" floodOpacity="0.35" />
                    </filter>
                    <filter id="slice-hover-glow" x="-40%" y="-40%" width="180%" height="180%">
                      <feDropShadow dx="0" dy="14" stdDeviation="10" floodColor="#0f172a" floodOpacity="0.4" />
                    </filter>

                    {/* Pedestal Gradients */}
                    <linearGradient id="cat-pedestal-top" x1="0%" y1="0%" x2="100%" y2="100%">
                      <stop offset="0%" stopColor="#f8fafc" />
                      <stop offset="100%" stopColor="#e2e8f0" />
                    </linearGradient>
                    <linearGradient id="cat-pedestal-wall" x1="0%" y1="0%" x2="0%" y2="100%">
                      <stop offset="0%" stopColor="#cbd5e1" />
                      <stop offset="100%" stopColor="#94a3b8" />
                    </linearGradient>

                    {/* Per-slice gradients for 3D faces */}
                    {processedSlices.map(slice => (
                      <React.Fragment key={`cat-grad-${slice.index}`}>
                        <radialGradient id={`cat-slice-top-${slice.index}`} cx="35%" cy="30%" r="75%">
                          <stop offset="0%" stopColor={slice.color} stopOpacity="1" />
                          <stop offset="100%" stopColor={slice.color} stopOpacity="0.88" />
                        </radialGradient>
                        <linearGradient id={`cat-slice-wall-${slice.index}`} x1="0%" y1="0%" x2="0%" y2="100%">
                          <stop offset="0%" stopColor={slice.color} stopOpacity="0.95" />
                          <stop offset="100%" stopColor="#0f172a" stopOpacity="0.65" />
                        </linearGradient>
                        <linearGradient id={`cat-slice-inner-${slice.index}`} x1="0%" y1="0%" x2="0%" y2="100%">
                          <stop offset="0%" stopColor="#0f172a" stopOpacity="0.45" />
                          <stop offset="100%" stopColor={slice.color} stopOpacity="0.75" />
                        </linearGradient>
                      </React.Fragment>
                    ))}
                  </defs>

                  {/* 1. 3D Isometric Pedestal Plinth (Ground Base) */}
                  <g className="pedestal-base">
                    <path
                      d={`M ${cx - baseRx} ${baseCy} A ${baseRx} ${baseRy} 0 0 0 ${cx + baseRx} ${baseCy} L ${cx + baseRx} ${baseCy + baseDepth} A ${baseRx} ${baseRy} 0 0 1 ${cx - baseRx} ${baseCy + baseDepth} Z`}
                      fill="url(#cat-pedestal-wall)"
                    />
                    <ellipse
                      cx={cx}
                      cy={baseCy}
                      rx={baseRx}
                      ry={baseRy}
                      fill="url(#cat-pedestal-top)"
                      stroke="#cbd5e1"
                      strokeWidth="1.5"
                    />
                    <ellipse
                      cx={cx}
                      cy={baseCy}
                      rx={baseRx - 15}
                      ry={baseRy - 7}
                      fill="none"
                      stroke="#94a3b8"
                      strokeWidth="1"
                      strokeDasharray="4 4"
                      opacity="0.45"
                    />
                  </g>

                  {/* 2. 3D Donut Slices */}
                  <g className="donut-slices">
                    {sortedSlices.map(slice => {
                      const isHovered = hoveredIdx === slice.index;
                      const explodeDist = isHovered ? 16 : 0;
                      const dx = Math.cos(slice.amid) * explodeDist;
                      const dy = Math.sin(slice.amid) * explodeDist * (ry / rx) - (isHovered ? 6 : 0);

                      const scx = cx + dx;
                      const scy = cy + dy;

                      const span = slice.a2 - slice.a1;
                      const largeArc = span > Math.PI ? 1 : 0;

                      // Outer points
                      const p1x = scx + rx * Math.cos(slice.a1);
                      const p1y = scy + ry * Math.sin(slice.a1);
                      const p2x = scx + rx * Math.cos(slice.a2);
                      const p2y = scy + ry * Math.sin(slice.a2);

                      // Inner points
                      const ip1x = scx + irx * Math.cos(slice.a1);
                      const ip1y = scy + iry * Math.sin(slice.a1);
                      const ip2x = scx + irx * Math.cos(slice.a2);
                      const ip2y = scy + iry * Math.sin(slice.a2);

                      // Top face path
                      const topPath = `M ${p1x} ${p1y} A ${rx} ${ry} 0 ${largeArc} 1 ${p2x} ${p2y} L ${ip2x} ${ip2y} A ${irx} ${iry} 0 ${largeArc} 0 ${ip1x} ${ip1y} Z`;

                      // Outer cylinder wall
                      const outerWallPath = `M ${p1x} ${p1y} A ${rx} ${ry} 0 ${largeArc} 1 ${p2x} ${p2y} L ${p2x} ${p2y + depth} A ${rx} ${ry} 0 ${largeArc} 0 ${p1x} ${p1y + depth} Z`;

                      // Inner cylinder wall
                      const innerWallPath = `M ${ip1x} ${ip1y} A ${irx} ${iry} 0 ${largeArc} 1 ${ip2x} ${ip2y} L ${ip2x} ${ip2y + depth} A ${irx} ${iry} 0 ${largeArc} 0 ${ip1x} ${ip1y + depth} Z`;

                      // Radial cut walls
                      const startCutPath = `M ${ip1x} ${ip1y} L ${p1x} ${p1y} L ${p1x} ${p1y + depth} L ${ip1x} ${ip1y + depth} Z`;
                      const endCutPath = `M ${ip2x} ${ip2y} L ${p2x} ${p2y} L ${p2x} ${p2y + depth} L ${ip2x} ${ip2y + depth} Z`;

                      // Percentage label position on slice top
                      const labelR = irx + (rx - irx) * 0.52;
                      const labelRy = iry + (ry - iry) * 0.52;
                      const lx = scx + labelR * Math.cos(slice.amid);
                      const ly = scy + labelRy * Math.sin(slice.amid);

                      return (
                        <g
                          key={`cat-slice-g-${slice.index}`}
                          className="cursor-pointer transition-all duration-200"
                          onMouseEnter={() => setHoveredIdx(slice.index)}
                          onMouseLeave={() => setHoveredIdx(null)}
                          filter={isHovered ? "url(#slice-hover-glow)" : undefined}
                          opacity={hoveredIdx !== null && !isHovered ? 0.65 : 1}
                        >
                          {/* Inner wall */}
                          <path
                            d={innerWallPath}
                            fill={`url(#cat-slice-inner-${slice.index})`}
                            stroke={slice.color}
                            strokeWidth="0.5"
                            strokeOpacity="0.4"
                          />

                          {/* Outer wall */}
                          <path
                            d={outerWallPath}
                            fill={`url(#cat-slice-wall-${slice.index})`}
                            stroke="rgba(0,0,0,0.15)"
                            strokeWidth="0.5"
                          />

                          {/* Radial cuts */}
                          <path
                            d={startCutPath}
                            fill={slice.color}
                            filter="brightness(0.75)"
                            stroke="rgba(0,0,0,0.2)"
                            strokeWidth="0.5"
                          />
                          <path
                            d={endCutPath}
                            fill={slice.color}
                            filter="brightness(0.85)"
                            stroke="rgba(0,0,0,0.2)"
                            strokeWidth="0.5"
                          />

                          {/* Top face */}
                          <path
                            d={topPath}
                            fill={`url(#cat-slice-top-${slice.index})`}
                            stroke="#ffffff"
                            strokeWidth={isHovered ? "2" : "1"}
                            strokeOpacity={isHovered ? "0.9" : "0.5"}
                          />

                          {/* Percentage Badge on Top Face (if >= 4%) */}
                          {slice.percent >= 4 && (
                            <g transform={`translate(${lx}, ${ly})`}>
                              <circle
                                r={isHovered ? "14" : "12"}
                                fill="rgba(15, 23, 42, 0.85)"
                                stroke="#ffffff"
                                strokeWidth="1"
                                className="transition-all"
                              />
                              <text
                                y="3.5"
                                textAnchor="middle"
                                fill="#ffffff"
                                fontSize={isHovered ? "10" : "9"}
                                fontWeight="800"
                                fontFamily="monospace"
                              >
                                {slice.percent}%
                              </text>
                            </g>
                          )}
                        </g>
                      );
                    })}
                  </g>

                  {/* 3. Center Hole Core Status */}
                  <g pointerEvents="none">
                    <circle cx={cx} cy={cy + 8} r="26" fill="rgba(15, 23, 42, 0.04)" />
                  </g>
                </svg>

                {/* Floating Center Badge overlay */}
                <div className="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-[62%] pointer-events-none text-center flex flex-col items-center justify-center p-2 rounded-xl backdrop-blur-xs select-none">
                  {hoveredItem ? (
                    <div className="animate-in zoom-in-95 duration-150">
                      <div className="inline-block w-2.5 h-2.5 rounded-full mb-0.5" style={{ backgroundColor: hoveredItem.color }}></div>
                      <div className="text-[10px] font-bold text-slate-500 dark:text-slate-400 max-w-[130px] truncate leading-tight">{hoveredItem.name}</div>
                      <div className="text-sm font-black font-mono text-slate-900 dark:text-white tracking-tight leading-tight">{hoveredItem.percent}%</div>
                      <div className="text-[9px] font-bold font-mono text-blue-600 dark:text-sky-300 mt-0.5">{formatCurrency(hoveredItem.value)}</div>
                    </div>
                  ) : (
                    <div>
                      <div className="text-[9px] font-extrabold uppercase tracking-widest text-slate-400 dark:text-slate-500 leading-none">TOTAL BEBAN</div>
                      <div className="text-sm font-black font-mono text-slate-800 dark:text-white tracking-tight mt-1 leading-none">{formatCurrency(grandTotal)}</div>
                      <div className="text-[9px] font-bold text-slate-500 dark:text-slate-400 mt-1">{processedSlices.length} Kategori</div>
                    </div>
                  )}
                </div>
              </div>

              {/* Interactive Side Breakdown Legend */}
              <div className="w-full xl:w-[42%] flex flex-col justify-center space-y-2 select-none">
                <div className="flex items-center justify-between pb-1.5 border-b border-slate-100 dark:border-slate-800 text-[11px] font-bold text-slate-400 dark:text-slate-500 uppercase tracking-wider">
                  <span>Kelompok Kategori</span>
                  <span>Alokasi & Nilai</span>
                </div>
                <div className="space-y-1.5 max-h-[260px] overflow-y-auto pr-1 scrollbar-thin">
                  {processedSlices.map(slice => {
                    const isHovered = hoveredIdx === slice.index;
                    return (
                      <div
                        key={`cat-legend-${slice.index}`}
                        onMouseEnter={() => setHoveredIdx(slice.index)}
                        onMouseLeave={() => setHoveredIdx(null)}
                        className={`p-2 rounded-xl transition-all cursor-pointer border ${
                          isHovered
                            ? 'bg-slate-50 dark:bg-slate-800 border-blue-400/60 dark:border-sky-500/50 shadow-xs scale-[1.02]'
                            : 'bg-white/60 dark:bg-slate-900/40 border-slate-100 dark:border-slate-800/80 hover:bg-slate-50/80 dark:hover:bg-slate-800/50'
                        }`}
                      >
                        <div className="flex items-center justify-between gap-2 text-xs">
                          <div className="flex items-center gap-2 min-w-0">
                            <span className="w-2.5 h-2.5 rounded-full shrink-0 shadow-2xs" style={{ backgroundColor: slice.color }}></span>
                            <span className={`font-semibold truncate text-[11.5px] ${isHovered ? 'text-slate-900 dark:text-white font-bold' : 'text-slate-700 dark:text-slate-300'}`}>
                              {slice.name}
                            </span>
                          </div>
                          <div className="text-right shrink-0">
                            <span className="font-mono font-bold text-slate-900 dark:text-white text-xs">{slice.percent}%</span>
                          </div>
                        </div>
                        <div className="flex items-center justify-between mt-1 text-[10.5px]">
                          <div className="w-full bg-slate-100 dark:bg-slate-800 h-1.5 rounded-full overflow-hidden mr-3">
                            <div
                              className="h-full rounded-full transition-all duration-500"
                              style={{ width: `${slice.percent}%`, backgroundColor: slice.color }}
                            ></div>
                          </div>
                          <span className="font-mono font-semibold text-slate-500 dark:text-slate-400 whitespace-nowrap text-[10px]">
                            {formatCurrency(slice.value)}
                          </span>
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>
            </div>
          );
        };

        const DashboardView = ({ data, isLoading, onEdit, onDelete, sheetData, persistentFilters, setPersistentFilters }) => {
          const [projectToDelete, setProjectToDelete] = useState(null);
          const [historyCurrentPage, setHistoryCurrentPage] = useState(1);
          const [savingSortOrder, setSavingSortOrder] = useState('none');
          const [pdfData, setPdfData] = useState(null);
          const [isRefreshing, setIsRefreshing] = useState(false);
          const [hoveredBudgetSlice, setHoveredBudgetSlice] = useState(null);

          const selectedYear = persistentFilters.year;
          const selectedMonth = persistentFilters.month;
          const poCodeFilter = persistentFilters.poCode;
          const dashboardFilters = persistentFilters.tableSearch;

          const setSelectedYear = (val) => setPersistentFilters(prev => ({ ...prev, year: val }));
          const setSelectedMonth = (val) => setPersistentFilters(prev => ({ ...prev, month: val }));
          const setPoCodeFilter = (val) => setPersistentFilters(prev => ({ ...prev, poCode: val }));
          const setDashboardFilters = (val) => setPersistentFilters(prev => ({ ...prev, tableSearch: typeof val === 'function' ? val(prev.tableSearch) : val }));
          const hasActiveDashboardFilters = Object.values(dashboardFilters).some(val => val !== '');

          useEffect(() => {
            if (!document.getElementById('html2pdf-script')) {
              const script = document.createElement('script'); script.id = 'html2pdf-script'; script.src = 'https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js'; document.body.appendChild(script);
            }
            if (!document.getElementById('html2canvas-script')) {
              const script = document.createElement('script'); script.id = 'html2canvas-script'; script.src = 'https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js'; document.body.appendChild(script);
            }
          }, []);

          const handleShowPdf = (projectKey, projectName, reqNumber) => {
            const projectItems = data.filter(item => {
              if (projectKey && getProjectKey(item) === projectKey) return true;
              return false;
            });
            const finalItems = projectItems.length > 0
              ? projectItems
              : data.filter(item => item.projectName === projectName && item.reqNumber === reqNumber);
            const summary = projectSummaryData.find(p => p.id === projectKey) || projectSummaryData.find(p => p.projectName === projectName && p.reqNumber === reqNumber);
            if (finalItems.length > 0 && summary) setPdfData({ items: finalItems, summary: summary });
          };

          const handleDownloadPdf = () => {
            const element = document.getElementById('pdf-content-area');
            if (element && window.html2pdf) {
                const opt = { 
                  margin: [0.4, 0.4, 0.4, 0.4], 
                  filename: `Tabulasi_${pdfData.summary.reqNumber.replace(/\//g, '_')}.pdf`, 
                  image: { type: 'jpeg', quality: 1 }, 
                  html2canvas: { scale: 2, useCORS: true, backgroundColor: '#ffffff' }, 
                  jsPDF: { unit: 'in', format: 'a4', orientation: 'landscape' } 
                };
                window.html2pdf().set(opt).from(element).save();
            }
          };

          const handleDownloadJpg = () => {
            const element = document.getElementById('pdf-content-area');
            if (element && window.html2canvas) {
                window.html2canvas(element, { scale: 2, useCORS: true, backgroundColor: '#ffffff' }).then(canvas => {
                    const link = document.createElement('a'); 
                    link.download = `Tabulasi_${pdfData.summary.reqNumber.replace(/\//g, '_')}.jpg`; 
                    link.href = canvas.toDataURL('image/jpeg', 1.0); 
                    link.click();
                });
            }
          };

          const handlePrintDirect = () => {
            window.print();
          };

          const availableYears = useMemo(() => {
            const years = new Set();
            data.forEach(item => { if (item.date) years.add(item.date.substring(0, 4)); });
            if (sheetData && sheetData.length > 0) sheetData.forEach(item => { if (item.year) years.add(String(item.year).trim()); });
            if (years.size === 0) years.add(String(new Date().getFullYear()));
            return Array.from(years).sort((a, b) => b.localeCompare(a));
          }, [data, sheetData]);

          const availableMonths = useMemo(() => {
            if (selectedYear === 'all') return [];
            const months = new Set();
            data.forEach(item => { if (item.date && item.date.startsWith(selectedYear)) months.add(item.date.substring(0, 7)); });
            
            if (sheetData && sheetData.length > 0) {
               sheetData.forEach(item => {
                  if (String(item.year).trim() === String(selectedYear) && item.standardMonth) {
                     months.add(item.standardMonth);
                  }
               });
            }
            return Array.from(months).sort((a, b) => b.localeCompare(a));
          }, [data, sheetData, selectedYear]);

          const filteredData = useMemo(() => {
            let filtered = data;
            if (selectedYear !== 'all') filtered = filtered.filter(item => item.date && item.date.startsWith(selectedYear));
            if (selectedMonth !== 'all') filtered = filtered.filter(item => item.date && item.date.startsWith(selectedMonth));
            if (poCodeFilter === '4M') filtered = filtered.filter(item => item.poNumber && item.poNumber.toUpperCase().includes('4M'));
            else if (poCodeFilter === '4T') filtered = filtered.filter(item => item.poNumber && item.poNumber.toUpperCase().includes('4T'));
            return filtered;
          }, [data, selectedYear, selectedMonth, poCodeFilter]);

          const processedData = useMemo(() => {
            return filteredData.map(item => ({ ...item, calculatedBids: item.bids.map(bid => ({ ...bid, totalPrice: bid.price * item.qty })) }));
          }, [filteredData]);

          const projectSummaryData = useMemo(() => {
            const grouped = {};
            processedData.forEach(item => {
              const pName = item.projectName || 'Tanpa Nama Project';
              const reqNum = item.reqNumber || 'NO-REQ';
              const key = getProjectKey(item);

              if (!grouped[key]) {
                grouped[key] = { id: key, submissionId: item.submissionId || key, reqNumber: item.reqNumber || '-', projectName: pName, poNumber: item.poNumber || '-', date: item.date, timestamp: item.timestamp || parseInt(item.id) || 0, itemCount: 0, suppliers: new Map() };
              } else {
                const itemTime = item.timestamp || parseInt(item.id) || 0;
                if (itemTime > grouped[key].timestamp) grouped[key].timestamp = itemTime;
              }
              
              grouped[key].itemCount += 1;
              if (item.poNumber && item.poNumber !== '-') grouped[key].poNumber = item.poNumber;
              item.calculatedBids.forEach(bid => {
                  if (bid.totalPrice > 0) { const currentTotal = grouped[key].suppliers.get(bid.supplier) || 0; grouped[key].suppliers.set(bid.supplier, currentTotal + bid.totalPrice); }
              });
            });

            return Object.values(grouped).map(proj => {
              let supplierList = Array.from(proj.suppliers.entries()).map(([name, totalValue]) => ({ name, totalValue })).sort((a, b) => a.totalValue - b.totalValue);
              const grandWinner = supplierList.length > 0 ? supplierList[0].name : '-';
              const grandWinnerPrice = supplierList.length > 0 ? supplierList[0].totalValue : 0;
              let baselinePrice = 0, totalSavingCost = 0, savingPercentage = 0;
              
              if (supplierList.length > 1) {
                  const losingBids = supplierList.slice(1);
                  const sumLosingBids = losingBids.reduce((sum, bid) => sum + bid.totalValue, 0);
                  baselinePrice = sumLosingBids / losingBids.length;
                  totalSavingCost = baselinePrice - grandWinnerPrice;
                  savingPercentage = ((totalSavingCost / baselinePrice) * 100).toFixed(2);
              } else { baselinePrice = grandWinnerPrice; }

              return { ...proj, supplierRanks: supplierList, grandWinner, totalSavingCost, savingPercentage, baselinePrice };
            }).sort((a, b) => {
                 const dateA = new Date(a.date).getTime(); const dateB = new Date(b.date).getTime();
                 if (dateB === dateA) return (b.timestamp || 0) - (a.timestamp || 0);
                 return dateB - dateA;
            });
          }, [processedData]);

          const filteredSheetData = useMemo(() => {
             let filtered = sheetData || [];
             
             if (selectedYear !== 'all') {
                 filtered = filtered.filter(item => String(item.year).trim() === String(selectedYear).trim());
             }
             
             if (selectedMonth !== 'all') {
                 filtered = filtered.filter(item => item.standardMonth === selectedMonth);
             }
             
             if (poCodeFilter !== 'all') {
                 filtered = filtered.filter(item => String(item.source).toUpperCase().trim() === String(poCodeFilter).toUpperCase().trim());
             }
             
             return filtered;
          }, [sheetData, selectedYear, selectedMonth, poCodeFilter]);

          const mirroredTotalSpend = useMemo(() => filteredSheetData.reduce((acc, curr) => acc + (Number(curr.total) || 0), 0), [filteredSheetData]);

          const sheetPeriodText = useMemo(() => {
            const MONTH_NAMES = [
              '', 'Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni',
              'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'
            ];

            // 1. Jika filter bulan dipilih secara spesifik
            if (selectedMonth && selectedMonth !== 'all') {
              const formattedMonth = formatMonthDisplay(selectedMonth);
              const yrSuffix = selectedYear !== 'all' ? ` ${selectedYear}` : (selectedMonth.includes('-') ? ` ${selectedMonth.split('-')[0]}` : '');
              return `${formattedMonth}${yrSuffix}`;
            }

            // 2. Jika filter bulan 'all', hitung rentang bulan otomatis dari dataset Google Sheet aktual
            const dataset = (filteredSheetData && filteredSheetData.length > 0) ? filteredSheetData : (sheetData || []);
            const monthNumbers = new Set();
            const years = new Set();

            dataset.forEach(item => {
              if (item.year) years.add(String(item.year).trim());
              
              if (item.standardMonth && item.standardMonth.includes('-')) {
                const parts = item.standardMonth.split('-');
                const m = parseInt(parts[1], 10);
                if (!isNaN(m) && m >= 1 && m <= 12) monthNumbers.add(m);
              } else if (item.month) {
                const m = parseInt(item.month, 10);
                if (!isNaN(m) && m >= 1 && m <= 12) monthNumbers.add(m);
              }
            });

            if (monthNumbers.size === 0) {
              return selectedYear !== 'all' ? `${selectedYear}` : 'Januari - Agustus';
            }

            const sortedMonths = Array.from(monthNumbers).sort((a, b) => a - b);
            const minM = sortedMonths[0];
            const maxM = sortedMonths[sortedMonths.length - 1];

            const minName = MONTH_NAMES[minM] || `Bulan ${minM}`;
            const maxName = MONTH_NAMES[maxM] || `Bulan ${maxM}`;

            let yrSuffix = '';
            if (selectedYear !== 'all') {
              yrSuffix = ` ${selectedYear}`;
            } else if (years.size === 1) {
              yrSuffix = ` ${Array.from(years)[0]}`;
            }

            if (minM === maxM) {
              return `${minName}${yrSuffix}`;
            }

            return `${minName} - ${maxName}${yrSuffix}`;
          }, [filteredSheetData, sheetData, selectedMonth, selectedYear]);

          const totalSavingCost = projectSummaryData.reduce((acc, curr) => acc + curr.totalSavingCost, 0);
          const baselinePriceCalc = mirroredTotalSpend + totalSavingCost;
          const overallSavingPercentage = baselinePriceCalc > 0 ? ((totalSavingCost / baselinePriceCalc) * 100).toFixed(2) : 0;

          const spendVsSavingData = useMemo(() => [ { name: 'Total Pengeluaran', value: mirroredTotalSpend }, { name: 'Total Saving Cost', value: totalSavingCost } ], [mirroredTotalSpend, totalSavingCost]);
          const totalPieValue = mirroredTotalSpend + totalSavingCost;

          const paretoData = useMemo(() => {

                        const formattedIntegerRate = integerPartRate ? new Intl.NumberFormat('id-ID').format(integerPartRate.replace(/\./g, '')) : '';
                        displayRate = partsRate.length > 1 ? `${formattedIntegerRate},${partsRate[1]}` : formattedIntegerRate;
                    }

                    prices[bid.supplier] = { amount: displayAmount, currency: bid.currency || 'IDR', customCurrency: '', rate: displayRate, note: bid.note || '' }; 
                    if(bid.currency && !['IDR','USD','EUR'].includes(bid.currency)) {
                         prices[bid.supplier].currency = 'Lainnya';
                         prices[bid.supplier].customCurrency = bid.currency;
                    }
                });
                let unitValue = item.unit, customUnitValue = '';
                if (!UNIT_OPTIONS.includes(item.unit)) { unitValue = 'Lainnya'; customUnitValue = item.unit; }
                return { id: item.id || Date.now() + Math.random(), description: item.itemDescription, qty: item.qty.toString().replace('.', ','), unit: unitValue, customUnit: customUnitValue, prices };
              });
              setItems(hydratedItems);
              window.scrollTo({ top: 0, behavior: 'smooth' });
            }
          }, [editData]);

          useEffect(() => {
             if (!editData && !reqNumber) {
                const dateObj = new Date(); const prefix = `REQ/${dateObj.getFullYear()}/${String(dateObj.getMonth() + 1).padStart(2, '0')}/`;
                let maxSequence = 0; 
                data.forEach(item => {

          }, [data, tableFilters, priceSortOrder]);

          useEffect(() => { setHistoriPage(1); }, [tableFilters, priceSortOrder]);

        const MONTH_LIST = [

          { num: 12, name: 'Desember', short: 'Des' }
        ];

        const QUICK_SPAREPART_KEYWORDS = [
          'SEMUA', 'BEARING', 'VALVE', 'GASKET', 'FILTER', 'SEAL', 'O-RING', 
          'V-BELT', 'SENSOR', 'SOLENOID', 'COUPLING', 'BAUT', 'CAT', 'OLI / GREASE', 'KABEL'
        ];

        const SparepartSearchView = ({ sheetData = [], availableYears = [] }) => {
          const [searchQuery, setSearchQuery] = useState('');
          const [selectedYear, setSelectedYear] = useState('2026');
          const [startMonth, setStartMonth] = useState(1);
          const [endMonth, setEndMonth] = useState(12);
          const [selectedStatus, setSelectedStatus] = useState('all'); // all, CLOSE, OPEN, BATAL
          const [activeSubTab, setActiveSubTab] = useState('summary'); // 'summary' (Sesuai Foto) | 'detail'
          const [showMatrixManual, setShowMatrixManual] = useState(false);
          const [currentPage, setCurrentPage] = useState(1);
          const [pageSize, setPageSize] = useState(15);
          const [summarySortBy, setSummarySortBy] = useState('qtyDesc'); // qtyDesc, qtyAsc, spendDesc, trxDesc, nameAsc
          const [matrixSearch, setMatrixSearch] = useState('');
          const [matrixSortBy, setMatrixSortBy] = useState('qtyDesc'); // qtyDesc, qtyAsc, nameAsc, spendDesc, latestMonthDesc
          const [matrixCurrentPage, setMatrixCurrentPage] = useState(1);
          const [matrixPageSize, setMatrixPageSize] = useState(15);
          const [focusedItem, setFocusedItem] = useState(null);
          const [showSuggestions, setShowSuggestions] = useState(false);
          const [toastMessage, setToastMessage] = useState('');

          const hasSearch = Boolean((searchQuery && searchQuery.trim().length > 0) || focusedItem);
          const shouldShowMatrix = hasSearch || showMatrixManual;

          // Detect latest active month in data - Khusus PO 4M
          const latestMonthInData = useMemo(() => {
            if (!sheetData || sheetData.length === 0) return 8;
            let maxM = 1;
            sheetData.forEach(item => {
              const poCode = String(item.source || '').toUpperCase().trim();
              if (poCode !== '4M') return;
              if (selectedYear !== 'all') {
                const itemYear = String(item.year || item.tahun || '2026');
                if (itemYear !== selectedYear) return;
              }
              if (item.monthNum > maxM && item.monthNum <= 12) maxM = item.monthNum;
            });
            return maxM || 8;
          }, [sheetData, selectedYear]);

          // Periode 3 Bulan Terakhir Pembelian (Maksimal 3 bulan ke belakang dari bulan terakhir data)
          const last3MonthsStart = useMemo(() => Math.max(1, latestMonthInData - 2), [latestMonthInData]);
          const last3MonthsEnd = latestMonthInData;

          // Extract all unique sparepart names (Kolom F) for autocomplete suggestions - Khusus PO 4M
          const allUniqueItemNames = useMemo(() => {
            if (!sheetData) return [];
            const setNames = new Set();
            sheetData.forEach(item => {
              if (String(item.source).toUpperCase().trim() !== '4M') return;
              const name = (item.namaBarang || item.vendor || '').trim();
              if (name && name !== 'Tanpa Item' && name !== 'NAMA BARANG' && name.length > 2) {
                setNames.add(name);
              }
            });
            return Array.from(setNames).sort();
          }, [sheetData]);

          // Autocomplete suggestions based on user input
          const autocompleteSuggestions = useMemo(() => {
            const q = searchQuery.trim().toLowerCase();
            if (!q || q.length < 2) return [];
            return allUniqueItemNames.filter(name => name.toLowerCase().includes(q)).slice(0, 7);
          }, [searchQuery, allUniqueItemNames]);

          // Filter sheetData based on Search Kolom F, Year, Period (Start to End Month), and Status - KHUSUS PO 4M SAJA
          const filteredData = useMemo(() => {
            if (!sheetData || sheetData.length === 0) return [];
            
            const minM = Math.min(startMonth, endMonth);
            const maxM = Math.max(startMonth, endMonth);

            return sheetData.filter(item => {
              // 0. Filter Mutlak: Hanya dibatasi Kode PO 4M saja
              if (String(item.source).toUpperCase().trim() !== '4M') return false;

              // 1. Filter Tahun
              if (selectedYear !== 'all') {
                const itemY = String(item.year || item.yearNum || '').trim();
                if (itemY && itemY !== String(selectedYear).trim()) return false;
              }
              
              // 2. Filter Periode Tarik Data (Dari Bulan ke Bulan)
              const mNum = Number(item.monthNum) || 0;
              if (mNum > 0) {
                if (mNum < minM || mNum > maxM) return false;
              } else {
                if (!(minM === 1 && maxM === 12)) return false;
              }

              // 3. Filter Status PO
              if (selectedStatus !== 'all') {
                const st = String(item.statusPo || '').toUpperCase();
                if (!st.includes(selectedStatus.toUpperCase())) return false;
              }

              // 4. If focused on a single item from summary
              if (focusedItem) {
                return (item.namaBarang || item.vendor) === focusedItem;
              }

              // 5. Pencarian Nama Barang Kolom F (mendukung multi-kata kunci)
              const q = searchQuery.trim().toLowerCase();
              if (q) {
                const words = q.split(/\s+/).filter(Boolean);
                const itemName = (item.namaBarang || item.vendor || '').toLowerCase();
                const supplierName = (item.supplier || '').toLowerCase();
                const poNum = (item.poNumber || '').toLowerCase();
                const sppNum = (item.spp || '').toLowerCase();

                const matches = words.every(w => 
                  itemName.includes(w) || supplierName.includes(w) || poNum.includes(w) || sppNum.includes(w)
                );
                if (!matches) return false;
              }

              return true;
            });
          }, [sheetData, selectedYear, startMonth, endMonth, selectedStatus, searchQuery, focusedItem]);

          // Resume Aggregations
          const stats = useMemo(() => {
            let totalQty = 0;
            let totalQtyDatang = 0;
            let totalSpend = 0;
            const uniqueItems = new Set();
            const supplierMap = {};

            filteredData.forEach(item => {
              const q = Number(item.qty) || 0;
              const qd = Number(item.qtyDatang) || 0;
              const tot = Number(item.total) || 0;

              totalQty += q;
              totalQtyDatang += qd;
              totalSpend += tot;

              const name = item.namaBarang || item.vendor;
              if (name && name !== 'Tanpa Item') uniqueItems.add(name);

              const supp = item.supplier;
              if (supp && supp !== 'Tanpa Supplier') {
                supplierMap[supp] = (supplierMap[supp] || 0) + q;
              }
            });

            let topSupplier = '-';
            let topSupplierQty = 0;
            Object.keys(supplierMap).forEach(supp => {
              if (supplierMap[supp] > topSupplierQty) {
                topSupplierQty = supplierMap[supp];
                topSupplier = supp;
              }
            });

            const fulfillmentRate = totalQty > 0 ? ((totalQtyDatang / totalQty) * 100).toFixed(1) : 0;

            return {
              totalQty,
              totalQtyDatang,
              fulfillmentRate,
              totalSpend,
              totalTrx: filteredData.length,
              uniqueCount: uniqueItems.size,
              topSupplier,
              topSupplierQty
            };
          }, [filteredData]);

          // Monthly trend data for the chosen period
          const monthlyTrendData = useMemo(() => {
            const months = [];
            const minM = Math.min(startMonth, endMonth);
            const maxM = Math.max(startMonth, endMonth);

            for (let m = minM; m <= maxM; m++) {
              months.push({
                monthNum: m,
                monthName: MONTH_LIST[m - 1].short,
                monthFullName: MONTH_LIST[m - 1].name,
                qty: 0,
                qtyDatang: 0,
                spend: 0,
                trxCount: 0
              });
            }

            filteredData.forEach(item => {
              const m = Number(item.monthNum) || 0;
              if (m >= minM && m <= maxM) {
                const target = months.find(entry => entry.monthNum === m);
                if (target) {
                  target.qty += (Number(item.qty) || 0);
                  target.qtyDatang += (Number(item.qtyDatang) || 0);
                  target.spend += (Number(item.total) || 0);
                  target.trxCount += 1;
                }
              }
            });

            return months;
          }, [filteredData, startMonth, endMonth]);

          // Grouped summary per Nama Barang (Kolom F)
          const groupedSummary = useMemo(() => {
            const map = {};

            filteredData.forEach(item => {
              const name = item.namaBarang || item.vendor || 'Tanpa Nama Barang';
              if (!map[name]) {
                map[name] = {
                  name: name,
                  category: item.category || 'Sparepart',
                  unit: item.unit || item.satuan || 'Unit',
                  totalQty: 0,
                  totalQtyDatang: 0,
                  totalSpend: 0,
                  trxCount: 0,
                  monthlyQty: {},
                  monthlySpend: {},
                  monthlyTrx: {},
                  suppliers: new Set(),
                  unitPrices: [],
                  lastDate: '',
                  lastPo: '',
                  lastSupplier: '',
                  currency: item.currency || 'IDR'
                };
              }
              const q = Number(item.qty) || 0;
              const qd = Number(item.qtyDatang) || 0;
              const tot = Number(item.total) || 0;
              const m = Number(item.monthNum) || 0;

              map[name].totalQty += q;
              map[name].totalQtyDatang += qd;
              map[name].totalSpend += tot;
              map[name].trxCount += 1;
              if (m > 0) {
                map[name].monthlyQty[m] = (map[name].monthlyQty[m] || 0) + q;
                map[name].monthlySpend[m] = (map[name].monthlySpend[m] || 0) + tot;
                map[name].monthlyTrx[m] = (map[name].monthlyTrx[m] || 0) + 1;
              }
              if (item.category && item.category !== '4M') map[name].category = item.category;
              if (item.unit || item.satuan) map[name].unit = item.unit || item.satuan;
              if (item.supplier) {
                map[name].suppliers.add(item.supplier);
                map[name].lastSupplier = item.supplier;
              }
              if (item.hargaSatuanNum > 0) map[name].unitPrices.push(item.hargaSatuanNum);
              if (item.tgl) map[name].lastDate = item.tgl;
              if (item.poNumber) map[name].lastPo = item.poNumber;
            });

            let list = Object.values(map).map(entry => {
              const avgPrice = entry.unitPrices.length > 0 
                ? entry.unitPrices.reduce((a, b) => a + b, 0) / entry.unitPrices.length 
                : (entry.totalQty > 0 ? entry.totalSpend / entry.totalQty : 0);
              return {
                ...entry,
                supplierCount: entry.suppliers.size,
                avgPrice: Math.round(avgPrice)
              };
            });

            // Sorting logic
            if (summarySortBy === 'qtyDesc') list.sort((a, b) => b.totalQty - a.totalQty);
            else if (summarySortBy === 'qtyAsc') list.sort((a, b) => a.totalQty - b.totalQty);
            else if (summarySortBy === 'spendDesc') list.sort((a, b) => b.totalSpend - a.totalSpend);
            else if (summarySortBy === 'trxDesc') list.sort((a, b) => b.trxCount - a.trxCount);
            else if (summarySortBy === 'nameAsc') list.sort((a, b) => a.name.localeCompare(b.name));

            return list;
          }, [filteredData, summarySortBy]);

          // Periode Bulan untuk Tabel Matriks Pemakaian Bulanan (minM s/d maxM)
          const matrixPeriodMonths = useMemo(() => {
            const minM = Math.min(startMonth, endMonth);
            const maxM = Math.max(startMonth, endMonth);
            const list = [];
            for (let m = minM; m <= maxM; m++) {
              list.push(MONTH_LIST[m - 1]);
            }
            return list;
          }, [startMonth, endMonth]);

          // Filter Pencarian Khusus Tabel Matriks Sparepart
          const matrixFilteredItems = useMemo(() => {
            let list = [...groupedSummary];
            const q = matrixSearch.trim().toLowerCase();
            if (q) {
              const words = q.split(/\s+/).filter(Boolean);
              list = list.filter(item => {
                const nameStr = (item.name || '').toLowerCase();
                const suppStr = (item.lastSupplier || '').toLowerCase();
                const catStr = (item.category || '').toLowerCase();
                return words.every(w => nameStr.includes(w) || suppStr.includes(w) || catStr.includes(w));
              });
            }

            if (matrixSortBy === 'qtyDesc') {
              list.sort((a, b) => b.totalQty - a.totalQty);
            } else if (matrixSortBy === 'qtyAsc') {
              list.sort((a, b) => a.totalQty - b.totalQty);
            } else if (matrixSortBy === 'nameAsc') {
              list.sort((a, b) => a.name.localeCompare(b.name));
            } else if (matrixSortBy === 'spendDesc') {
              list.sort((a, b) => b.totalSpend - a.totalSpend);
            } else if (matrixSortBy === 'latestMonthDesc') {
              const lastM = matrixPeriodMonths[matrixPeriodMonths.length - 1]?.num || 12;
              list.sort((a, b) => (b.monthlyQty[lastM] || 0) - (a.monthlyQty[lastM] || 0));
            }
            return list;
          }, [groupedSummary, matrixSearch, matrixSortBy, matrixPeriodMonths]);

          // Akumulasi Total Qty per Bulan di Tabel Matriks (Selaras dengan Grafik Bar)
          const matrixMonthlyTotals = useMemo(() => {
            const totals = {};
            matrixPeriodMonths.forEach(m => {
              totals[m.num] = 0;
            });
            let grandQty = 0;
            let grandSpend = 0;

            matrixFilteredItems.forEach(item => {
              matrixPeriodMonths.forEach(m => {
                const q = item.monthlyQty[m.num] || 0;
                totals[m.num] += q;
              });
              grandQty += (item.totalQty || 0);
              grandSpend += (item.totalSpend || 0);
            });

            return { totals, grandQty, grandSpend };
          }, [matrixFilteredItems, matrixPeriodMonths]);

          // Pagination untuk Matriks
          const totalMatrixPages = Math.max(1, Math.ceil(matrixFilteredItems.length / matrixPageSize));
          const paginatedMatrix = useMemo(() => {
            const start = (matrixCurrentPage - 1) * matrixPageSize;
            return matrixFilteredItems.slice(start, start + matrixPageSize);
          }, [matrixFilteredItems, matrixCurrentPage, matrixPageSize]);

          // Pagination
          const totalSummaryPages = Math.max(1, Math.ceil(groupedSummary.length / pageSize));
          const totalDetailPages = Math.max(1, Math.ceil(filteredData.length / pageSize));
          
          const paginatedSummary = useMemo(() => {
            const start = (currentPage - 1) * pageSize;
            return groupedSummary.slice(start, start + pageSize);
          }, [groupedSummary, currentPage, pageSize]);

          const paginatedDetail = useMemo(() => {
            const start = (currentPage - 1) * pageSize;
            return filteredData.slice(start, start + pageSize);
          }, [filteredData, currentPage, pageSize]);

          // Quick preset period selector handler
          const handleApplyPresetPeriod = (start, end, label = '') => {
            setStartMonth(start);
            setEndMonth(end);
            setCurrentPage(1);
            setMatrixCurrentPage(1);
            if (label) {
              setToastMessage(`Filter periode diaktifkan: ${label}`);
              setTimeout(() => setToastMessage(''), 2500);
            }
          };

          // Salin Matriks Bulanan ke Clipboard (Format TSV untuk Excel / Spreadsheet)
          const handleCopyMatrixTSV = () => {
            let tsv = `No\tNama Sparepart / Item (Kolom F)\t` + matrixPeriodMonths.map(m => `Bln ${m.num} (${m.short})`).join('\t') + `\tTotal Qty\tRata-rata/Bln\tTotal Pembelian (IDR)\n`;
            
            matrixFilteredItems.forEach((item, idx) => {
              const mCells = matrixPeriodMonths.map(m => item.monthlyQty[m.num] || 0).join('\t');
              const avg = matrixPeriodMonths.length > 0 ? (item.totalQty / matrixPeriodMonths.length).toFixed(1) : 0;
              tsv += `${idx + 1}\t${item.name}\t${mCells}\t${item.totalQty}\t${avg}\t${item.totalSpend}\n`;
            });

            const totalCells = matrixPeriodMonths.map(m => matrixMonthlyTotals.totals[m.num] || 0).join('\t');
            const grandAvg = matrixPeriodMonths.length > 0 ? (matrixMonthlyTotals.grandQty / matrixPeriodMonths.length).toFixed(1) : 0;
            tsv += `TOTAL\tSemua Sparepart (${matrixFilteredItems.length} Item)\t${totalCells}\t${matrixMonthlyTotals.grandQty}\t${grandAvg}\t${matrixMonthlyTotals.grandSpend}\n`;

            navigator.clipboard.writeText(tsv).then(() => {
              setToastMessage('Tabel Matriks Bulanan berhasil disalin! Anda bisa langsung Paste (Ctrl+V) ke Excel atau Google Sheets.');
              setTimeout(() => setToastMessage(''), 4000);
            }).catch(() => {
              setToastMessage('Gagal menyalin ke clipboard');
              setTimeout(() => setToastMessage(''), 2500);
            });
          };

          // Export Matrix CSV
          const handleExportMatrixCSV = () => {
            let csv = 'No,Nama Sparepart,' + matrixPeriodMonths.map(m => `"Bulan ${m.num} - ${m.name}"`).join(',') + ',Total Qty,Rata-rata/Bulan,Total Nilai Pembelian (IDR)\n';
            matrixFilteredItems.forEach((item, idx) => {
              const cleanName = `"${item.name.replace(/"/g, '""')}"`;
              const mCells = matrixPeriodMonths.map(m => item.monthlyQty[m.num] || 0).join(',');
              const avg = matrixPeriodMonths.length > 0 ? (item.totalQty / matrixPeriodMonths.length).toFixed(1) : 0;
              csv += `${idx + 1},${cleanName},${mCells},${item.totalQty},${avg},${item.totalSpend}\n`;
            });
            const totalCells = matrixPeriodMonths.map(m => matrixMonthlyTotals.totals[m.num] || 0).join(',');
            const grandAvg = matrixPeriodMonths.length > 0 ? (matrixMonthlyTotals.grandQty / matrixPeriodMonths.length).toFixed(1) : 0;
            csv += `TOTAL,"Semua Sparepart (${matrixFilteredItems.length} Item)",${totalCells},${matrixMonthlyTotals.grandQty},${grandAvg},${matrixMonthlyTotals.grandSpend}\n`;

            downloadCSV(csv, `matriks_pemakaian_sparepart_bulanan_${selectedYear}_bln_${startMonth}_ke_${endMonth}.csv`);
          };

          // Export CSV function
          const handleExportCSV = () => {
            if (activeSubTab === 'monthlyMatrix') {
              handleExportMatrixCSV();
            } else if (activeSubTab === 'summary') {
              let csv = 'No,Nama Barang,Total QTY Dibeli,QTY Datang,Total Pembelian (IDR),Frekuensi PO,Rata-rata Harga Satuan,Supplier Terakhir,Tgl Terakhir,No PO Terakhir\n';
              groupedSummary.forEach((item, idx) => {
                const cleanName = `"${item.name.replace(/"/g, '""')}"`;
                const cleanSupp = `"${(item.lastSupplier || '').replace(/"/g, '""')}"`;
                csv += `${idx + 1},${cleanName},${item.totalQty},${item.totalQtyDatang},${item.totalSpend},${item.trxCount},${item.avgPrice},${cleanSupp},"${item.lastDate}","${item.lastPo}"\n`;
              });
              downloadCSV(csv, `resume_sparepart_po_4m_periode_bln_${startMonth}_ke_${endMonth}_${selectedYear}.csv`);
            } else {
              let csv = 'No PO,Tanggal PO,SPP,Supplier,Nama Barang,QTY,QTY Datang,Harga Satuan,Harga Total,Status,Keterangan\n';
              filteredData.forEach(item => {
                csv += `"${item.poNumber}","${item.tgl}","${item.spp}","${(item.supplier || '').replace(/"/g, '""')}","${(item.namaBarang || '').replace(/"/g, '""')}",${item.qty},${item.qtyDatang},"${item.hargaSatuan || item.hargaSatuanNum}",${item.total},"${item.statusPo}","${(item.keterangan || '').replace(/"/g, '""')}"\n`;
              });
              downloadCSV(csv, `detail_transaksi_sparepart_po_4m_periode_bln_${startMonth}_ke_${endMonth}_${selectedYear}.csv`);
            }
          };

          const downloadCSV = (csvContent, fileName) => {
            const blob = new Blob(["\uFEFF" + csvContent], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.setAttribute('href', url);
            link.setAttribute('download', fileName);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            setToastMessage(`File ${fileName} berhasil diunduh!`);
            setTimeout(() => setToastMessage(''), 3500);
          };

          // Copy summary to clipboard
          const handleCopySummary = () => {
            const pText = `Periode Bulan ${startMonth} (${MONTH_LIST[startMonth-1].name}) s/d Bulan ${endMonth} (${MONTH_LIST[endMonth-1].name}) ${selectedYear}`;
            const sText = searchQuery ? `Kata Kunci: "${searchQuery}"` : (focusedItem ? `Item: "${focusedItem}"` : 'Semua Sparepart (Khusus PO 4M)');
            let txt = `*RESUME PEMBELIAN SPAREPART (KHUSUS PO 4M) - PORTAL PROCUREMENT SJA3*\n`;
            txt += `${pText}\n`;
            txt += `${sText}\n`;
            txt += `---------------------------------------------------\n`;
            txt += `Total QTY Pembelian   : ${stats.totalQty.toLocaleString('id-ID')} Unit/Pcs\n`;
            txt += `Realisasi QTY Datang  : ${stats.totalQtyDatang.toLocaleString('id-ID')} Unit (${stats.fulfillmentRate}%)\n`;
            txt += `Total Transaksi PO    : ${stats.totalTrx} Transaksi\n`;
            txt += `Total Nilai Pembelian : ${formatCurrency(stats.totalSpend)}\n`;
            txt += `Jumlah Varian Item    : ${stats.uniqueCount} Jenis Sparepart\n`;
            txt += `Supplier Terbanyak    : ${stats.topSupplier} (${stats.topSupplierQty.toLocaleString('id-ID')} Unit)\n`;
            txt += `---------------------------------------------------\n`;
            txt += `Daftar Top 5 Item Terbesar:\n`;
            groupedSummary.slice(0, 5).forEach((item, i) => {
              txt += `${i + 1}. ${item.name}\n   - QTY: ${item.totalQty.toLocaleString('id-ID')} | Total: ${formatCurrency(item.totalSpend)} | PO: ${item.trxCount}x\n`;
            });

            if (navigator.clipboard) {
              navigator.clipboard.writeText(txt).then(() => {
                setToastMessage('Ringkasan berhasil disalin ke clipboard!');
                setTimeout(() => setToastMessage(''), 3000);
              });
            }
          };

          // Reset all filters
          const handleResetFilters = () => {
            setSearchQuery('');
            setFocusedItem(null);
            setSelectedYear('2026');
            setStartMonth(1);
            setEndMonth(latestMonthInData);
            setSelectedStatus('all');
            setCurrentPage(1);
          };

          return (
            <div id="section-pencarian-sparepart" className="bg-white rounded-xl p-6 sm:p-8 border border-slate-200/80 shadow-[0_1px_3px_0_rgba(15,23,42,0.03)] mt-8 transition-all">
              {/* Header Title Bar */}
              <div className="flex flex-col md:flex-row md:items-center justify-between gap-4 pb-6 border-b border-slate-100">
                <div className="flex items-start sm:items-center">
                  <div className="w-10 h-10 rounded-lg bg-slate-900 text-white flex items-center justify-center mr-3.5 shadow-xs shrink-0">
                    <Wrench className="w-4 h-4" />
                  </div>
                  <div>
                    <h2 className="text-base sm:text-lg font-bold text-slate-900 tracking-tight">Data Pemakaian Sparepart & Resume Pembelian</h2>
                    <div className="flex items-center gap-2 text-xs text-slate-500 mt-1 flex-wrap">
                      <span className="font-semibold text-slate-700">Khusus Kode PO 4M</span>
                      <span aria-hidden="true" className="text-slate-300">·</span>
                      <span className="inline-flex items-center text-emerald-700 font-medium"><span className="w-1.5 h-1.5 rounded-full bg-emerald-500 mr-1.5 animate-pulse"></span>Live Google Sheets</span>
                      <span aria-hidden="true" className="text-slate-300">·</span>
                      <span>Sistem Akumulasi Periode Tarik Data</span>
                    </div>
                  </div>
                </div>

                {/* Header Action Buttons */}
                <div className="flex items-center gap-2 shrink-0">
                  <button
                    id="btn-copy-sparepart-summary"
                    onClick={handleCopySummary}
                    title="Salin ringkasan ke clipboard"
                    className="inline-flex items-center px-3 py-1.5 text-xs font-semibold text-slate-700 bg-white hover:bg-slate-50 border border-slate-200 rounded-lg transition-colors shadow-2xs"
                  >
                    <Copy className="w-3.5 h-3.5 mr-1.5 text-slate-400" />
                    Salin Resume
                  </button>
                  <button
                    id="btn-export-sparepart-csv"
                    onClick={handleExportCSV}
                    title="Ekspor hasil pencarian ke format Excel/CSV"
                    className="inline-flex items-center px-3.5 py-1.5 text-xs font-semibold text-white bg-slate-900 hover:bg-slate-800 rounded-lg transition-colors shadow-xs"
                  >
                    <Download className="w-3.5 h-3.5 mr-1.5 text-slate-300" />
                    Ekspor CSV
                  </button>
                  <button
                    id="btn-reset-sparepart-filters"
                    onClick={handleResetFilters}
                    title="Reset semua filter pencarian"
                    className="inline-flex items-center p-1.5 text-slate-400 hover:text-slate-700 hover:bg-slate-100 border border-slate-200 rounded-lg transition-colors"
                  >
                    <RefreshCw className="w-3.5 h-3.5" />
                  </button>
                </div>
              </div>

              {/* Toast Notification */}
              {toastMessage && (
                <div className="mt-4 p-3 bg-indigo-50 border border-indigo-200 rounded-xl flex items-center text-xs font-bold text-indigo-800 animate-in fade-in">
                  <Check className="w-4 h-4 mr-2 text-indigo-600 shrink-0" />
                  {toastMessage}
                </div>
              )}

              {/* Focus Banner (if inspecting specific item) */}
              {focusedItem && (
                <div className="mt-4 p-3 bg-slate-50 border border-slate-200 rounded-lg flex items-center justify-between flex-wrap gap-2 animate-in fade-in">
                  <div className="flex items-center">
                    <Package className="w-4 h-4 mr-2 text-slate-700" />
                    <span className="text-xs text-slate-700">
                      Riwayat pembelian spesifik untuk: <strong className="font-semibold text-slate-900 font-mono">{focusedItem}</strong>
                    </span>
                  </div>
                  <button
                    onClick={() => setFocusedItem(null)}
                    className="text-xs font-semibold px-2.5 py-1 bg-white border border-slate-300 text-slate-700 hover:bg-slate-100 rounded-md transition-colors"
                  >
                    Reset Fokus
                  </button>
                </div>
              )}

              {/* Search & Period Filter Control Card */}
              <div className="mt-5 p-5 bg-slate-50/60 border border-slate-200/80 rounded-xl space-y-4">
                {/* Search Bar - Kolom F (Nama Barang) */}
                <div className="relative">
                  <div className="flex items-center justify-between mb-1.5">
                    <label className="text-xs font-bold text-slate-800 flex items-center">
                      <Search className="w-3.5 h-3.5 mr-1.5 text-slate-500" />
                      Pencarian Nama Barang / Sparepart
                    </label>
                    <span className="text-[11px] text-slate-500 font-mono">
                      {allUniqueItemNames.length} item terdaftar
                    </span>
                  </div>
                  <div className="relative">
                    <input
                      id="input-search-sparepart-name"
                      type="text"
                      value={searchQuery}
                      onChange={(e) => {
                        setSearchQuery(e.target.value);
                        setFocusedItem(null);
                        setCurrentPage(1);
                        setShowSuggestions(true);
                      }}
                      onFocus={() => setShowSuggestions(true)}
                      placeholder="Ketik nama sparepart / item (cth: BEARING, VALVE, GASKET, FILTER, SEAL, O-RING, V-BELT, PNEUMATIC, BAUT)..."
                      className="w-full pl-9 pr-9 py-2 bg-white border border-slate-300 rounded-lg text-xs font-medium text-slate-900 placeholder-slate-400 focus:outline-none focus:ring-1 focus:ring-slate-900 focus:border-slate-900 transition-colors shadow-2xs"
                    />
                    <Search className="w-4 h-4 text-slate-400 absolute left-3 top-2.5 pointer-events-none" />
                    {searchQuery && (
                      <button
                        onClick={() => {
                          setSearchQuery('');
                          setShowSuggestions(false);
                          setCurrentPage(1);
                        }}
                        className="absolute right-2.5 top-2.5 p-0.5 text-slate-400 hover:text-slate-600 hover:bg-slate-100 rounded"
                      >
                        <X className="w-3.5 h-3.5" />
                      </button>
                    )}
                  </div>

                  {/* Autocomplete Dropdown suggestions */}
                  {showSuggestions && autocompleteSuggestions.length > 0 && (
                    <div className="absolute z-30 left-0 right-0 mt-1 bg-white rounded-lg shadow-lg border border-slate-200 py-1.5 overflow-hidden animate-in fade-in duration-100">
                      <div className="px-3 py-1 text-[10px] font-bold text-slate-400 uppercase tracking-wider border-b border-slate-100 mb-1">
                        Saran Hasil Pencarian:
                      </div>
                      {autocompleteSuggestions.map((item, idx) => (
                        <button
                          key={idx}
                          type="button"
                          onClick={() => {
                            setSearchQuery(item);
                            setShowSuggestions(false);
                            setCurrentPage(1);
                          }}
                          className="w-full text-left px-3.5 py-1.5 text-xs font-medium text-slate-700 hover:bg-slate-50 hover:text-slate-900 flex items-center justify-between transition-colors"
                        >
                          <span className="truncate">{item}</span>
                          <span className="text-[10px] font-mono text-slate-400 bg-slate-100 px-1.5 py-0.5 rounded shrink-0 ml-2">
                            Pilih
                          </span>
                        </button>
                      ))}
                    </div>
                  )}
                </div>

                {/* Quick Sparepart Category Chips */}
                <div>
                  <div className="text-[11px] font-semibold text-slate-500 mb-2 flex items-center">
                    <SlidersHorizontal className="w-3 h-3 mr-1.5 text-slate-400" />
                    Kategori Cepat:
                  </div>
                  <div className="flex flex-wrap gap-1.5">
                    {QUICK_SPAREPART_KEYWORDS.map(kw => {
                      const isSelected = kw === 'SEMUA' 
                        ? (!searchQuery && !focusedItem) 
                        : searchQuery.toUpperCase() === kw;
                      return (
                        <button
                          key={kw}
                          id={`chip-sparepart-${kw.toLowerCase().replace(/[^a-z0-9]/g, '-')}`}
                          type="button"
                          onClick={() => {
                            if (kw === 'SEMUA') {
                              setSearchQuery('');
                            } else {
                              setSearchQuery(kw);
                            }
                            setFocusedItem(null);
                            setCurrentPage(1);
                            setShowSuggestions(false);
                          }}
                          className={`px-2.5 py-1 rounded-md text-xs font-medium transition-colors ${
                            isSelected
                              ? 'bg-slate-900 text-white font-semibold shadow-xs'
                              : 'bg-white text-slate-600 border border-slate-200 hover:bg-slate-100 hover:text-slate-900'
                          }`}
                        >
                          {kw}
                        </button>
                      );
                    })}
                  </div>
                </div>

                {/* Sistem Periode Tarik Data (Dari Bulan 1 ke Bulan Selanjutnya) */}
                <div className="pt-3 border-t border-slate-200">
                  <div className="text-xs font-bold text-slate-800 mb-2.5 flex items-center">
                    <Calendar className="w-3.5 h-3.5 mr-1.5 text-slate-500" />

              const cleanPrice = (priceStr) => {
