                let s = priceStr.toString().replace(/Rp/gi, '').replace(/\s/g, '');
                if (s.endsWith(',00') || s.endsWith('.00')) s = s.slice(0, -3);
                s = s.replace(/[,.]/g, '');
                const match = s.match(/^-?\d+/);
                return match ? Number(match[0]) : 0;
              };

              const cleanQty = (val) => {
                if (val === undefined || val === null) return 0;
                let s = val.toString().trim();
                if (!s || s === '-' || s === '0') return 0;
                if (s.includes(',') && !s.includes('.')) {
                  s = s.replace(',', '.');
                } else if (s.includes('.') && s.includes(',')) {
                  s = s.replace(/\./g, '').replace(',', '.');
                }
                const n = parseFloat(s);
                return isNaN(n) ? 0 : n;
              };

              const processRow = (row, sourceSheet, parsed) => {
                  if (row.length <= 10) return;
                  const cleanCol = (str) => typeof str === 'string' ? str.replace(/^"|"$/g, '').trim() : (str ? String(str).trim() : '');
                  const checkVendor = cleanCol(row[5]).toUpperCase();
                  const checkKeterlambatan = cleanCol(row[21]).toUpperCase();
                  if (checkVendor === 'NAMA BARANG' || checkKeterlambatan === 'KETERLAMBATAN') return;
                  
                  const statusPoVal = cleanCol(row[0]);
                  const tglVal = cleanCol(row[1]);
                  const poNumberVal = cleanCol(row[2]);
                  const sppVal = cleanCol(row[3]);
                  const supplierVal = cleanCol(row[4]);
                  const vendorVal = cleanCol(row[5]); // Kolom F: NAMA BARANG
                  const qtyVal = cleanQty(cleanCol(row[6])); // Kolom G: QTY
                  const currencyVal = cleanCol(row[7]) || 'IDR';
                  const hargaSatuanRaw = cleanCol(row[8]);
                  const priceK = cleanPrice(cleanCol(row[10])); // Kolom K: HARGA TOTAL
                  const tglDatangVal = cleanCol(row[13]);
                  const qtyDatangVal = cleanQty(cleanCol(row[14]));
                  const keteranganDetail = cleanCol(row[15]);
                  const accountVal = cleanCol(row[17]);
                  const keterangan1 = cleanCol(row[18]);
                  const keterlambatanVal = cleanCol(row[21]);
                  const monthValRaw = cleanCol(row[22]);
                  const yearVal = cleanCol(row[23]);
                  
                  let monthNum = 0;
                  if (monthValRaw) {
                       const mStr = String(monthValRaw).toLowerCase().trim();
                       if (mStr.includes('jan')) monthNum = 1;
                       else if (mStr.includes('feb')) monthNum = 2;
                       else if (mStr.includes('mar')) monthNum = 3;
                       else if (mStr.includes('apr')) monthNum = 4;
                       else if (mStr.includes('mei') || mStr.includes('may')) monthNum = 5;
                       else if (mStr.includes('jun')) monthNum = 6;
                       else if (mStr.includes('jul')) monthNum = 7;
                       else if (mStr.includes('agu') || mStr.includes('aug')) monthNum = 8;
                       else if (mStr.includes('sep')) monthNum = 9;
                       else if (mStr.includes('okt') || mStr.includes('oct')) monthNum = 10;
                       else if (mStr.includes('nov') || mStr.includes('nop')) monthNum = 11;
                       else if (mStr.includes('des') || mStr.includes('dec')) monthNum = 12;
                  }
                  if (monthNum === 0 && tglVal) {
                       const tStr = tglVal.toLowerCase();
                       if (tStr.includes('jan')) monthNum = 1;
                       else if (tStr.includes('feb')) monthNum = 2;
                       else if (tStr.includes('mar')) monthNum = 3;
                       else if (tStr.includes('apr')) monthNum = 4;
                       else if (tStr.includes('mei') || tStr.includes('may')) monthNum = 5;
                       else if (tStr.includes('jun')) monthNum = 6;
                       else if (tStr.includes('jul')) monthNum = 7;
                       else if (tStr.includes('agu') || tStr.includes('aug')) monthNum = 8;
                       else if (tStr.includes('sep')) monthNum = 9;
                       else if (tStr.includes('okt') || tStr.includes('oct')) monthNum = 10;
                       else if (tStr.includes('nov') || tStr.includes('nop')) monthNum = 11;
                       else if (tStr.includes('des') || tStr.includes('dec')) monthNum = 12;
                  }

                  let yearNum = 0;
                  if (yearVal) {
                      const yInt = parseInt(yearVal.trim(), 10);
                      if (!isNaN(yInt)) yearNum = yInt;
                  } else if (tglVal && (tglVal.includes('-26') || tglVal.includes('2026'))) {
                      yearNum = 2026;
                  }

                  let standardMonth = null;
                  if ((yearVal || yearNum) && monthNum > 0) {
                      const mNumStr = monthNum < 10 ? `0${monthNum}` : `${monthNum}`;
                      standardMonth = `${(yearVal || yearNum).toString().trim()}-${mNumStr}`;
                  }

                  if (priceK > 0 || poNumberVal || keterangan1 || vendorVal) {
                      parsed.push({ 
                          category: keterangan1 || 'Tanpa Kategori', 
                          total: priceK, 
                          month: monthValRaw, 
                          standardMonth: standardMonth, 
                          year: yearVal || (yearNum ? String(yearNum) : '2026'), 
                          vendor: vendorVal || 'Tanpa Item', 
                          namaBarang: vendorVal || 'Tanpa Item',
                          supplier: supplierVal || 'Tanpa Supplier', 
                          poNumber: poNumberVal, 
                          source: sourceSheet, 
                          keterlambatan: keterlambatanVal,
                          statusPo: statusPoVal || 'CLOSE',
                          tgl: tglVal,
                          spp: sppVal,
                          qty: qtyVal,
                          qtyDatang: qtyDatangVal,
                          currency: currencyVal,
                          hargaSatuan: hargaSatuanRaw,
                          hargaSatuanNum: cleanPrice(hargaSatuanRaw),
                          tglDatang: tglDatangVal,
                          keterangan: keteranganDetail,
                          account: accountVal,
                          monthNum: monthNum,
                          yearNum: yearNum || 2026
                      });
                      if (standardMonth) monthSet.add(standardMonth);
                      if (yearVal) yearSet.add(yearVal);
                      else if (yearNum) yearSet.add(String(yearNum));
                  }
              };

              const parseCSV = (csvText, sourceSheet) => {
                  const parsed = [];
                  if (!csvText) return parsed;
                  let row = [], inQuote = false, currentVal = '';
                  for (let i = 0; i < csvText.length; i++) {
                      let char = csvText[i];
                      if (char === '"') { if (inQuote && csvText[i+1] === '"') { currentVal += '"'; i++; } else { inQuote = !inQuote; } } 
                      else if (char === ',' && !inQuote) { row.push(currentVal); currentVal = ''; } 
                      else if ((char === '\n' || char === '\r') && !inQuote) {
                          if (char === '\r' && csvText[i+1] === '\n') i++; 
                          row.push(currentVal);
                          processRow(row, sourceSheet, parsed);
                          row = []; currentVal = '';
                      } else { currentVal += char; }
                  }
                  if (currentVal || row.length > 0) {
                      row.push(currentVal);
                      processRow(row, sourceSheet, parsed);
                  }
                  return parsed;
              };

                const finalData = [...newItemsArray, ...currentData].sort((a, b) => new Date(b.date).getTime() - new Date(a.date).getTime());
                localStorage.setItem('sja_procurement_data', JSON.stringify(finalData));

                }, 100);
                return;

                          {isDokumenOpen && (

                              <button onClick={() => setActiveTab('sop-wi')} className={subNavItemClass(activeTab === 'sop-wi')}><BookOpen className="w-3.5 h-3.5 mr-2.5 opacity-70 group-hover:opacity-100" /> SOP & Instruksi Kerja</button>
                              <button onClick={() => setActiveTab('form')} className={subNavItemClass(activeTab === 'form')}><FileText className="w-3.5 h-3.5 mr-2.5 opacity-70 group-hover:opacity-100" /> Form Standar</button>
                              <button onClick={() => setActiveTab('seleksi-supplier')} className={subNavItemClass(activeTab === 'seleksi-supplier')}><Users className="w-3.5 h-3.5 mr-2.5 opacity-70 group-hover:opacity-100" /> Seleksi Supplier</button>
                              <button onClick={() => setActiveTab('evaluasi-supplier')} className={subNavItemClass(activeTab === 'evaluasi-supplier')}><CheckCircle2 className="w-3.5 h-3.5 mr-2.5 opacity-70 group-hover:opacity-100" /> Evaluasi Supplier</button>
                              <button onClick={() => setActiveTab('backup-restore-dokumen')} className={subNavItemClass(activeTab === 'backup-restore-dokumen')}><Database className="w-3.5 h-3.5 mr-2.5 opacity-70 group-hover:opacity-100" /> Backup & Restore</button>
                            </div>
                          )}
                        </div>
                      </div>
                    )}
                  </nav>
                  <div className="absolute bottom-0 left-0 right-0 p-4 bg-[#0f172a] border-t border-[#1e293b]">
                    <button onClick={handleLogout} className="w-full flex items-center justify-center px-4 py-2.5 rounded-xl bg-slate-800 hover:bg-rose-500/10 hover:text-rose-400 text-slate-300 transition-colors border border-[#1e293b] hover:border-rose-500/20 text-xs font-bold tracking-wide">
                      <LogOut className="w-4 h-4 mr-2" /> Akhiri Sesi
                    </button>
                  </div>
                </div>
              </aside>

              <header className="md:hidden flex items-center justify-between px-5 py-4 bg-[#0f172a] border-b border-[#1e293b] z-10 shadow-sm text-white">
                <div className="flex items-center">
                  <div className="w-8 h-8 bg-white rounded flex items-center justify-center mr-2 p-1 overflow-hidden shrink-0">{appLogo ? <img src={appLogo} alt="Logo" className="w-full h-full object-contain" /> : <ImageIcon className="w-4 h-4 text-slate-300" />}</div>
                  <span className="text-white font-extrabold text-sm tracking-tight">Portal SJA</span>
                </div>
                <div className="flex items-center gap-2">
                  {/* Tombol 2 Mode Layar (Mobile) */}
                  <div className="flex items-center p-0.5 rounded-full bg-slate-800 border border-slate-700 shadow-2xs select-none">
                    <button
                      type="button"
                      onClick={() => setTheme('light')}
                      className={`p-1.5 rounded-full transition-all ${theme === 'light' ? 'bg-white text-amber-600 shadow-xs ring-1 ring-slate-200' : 'text-slate-400 hover:text-slate-200'}`}
                      title="Mode Terang"
                    >
                      <Sun className="w-3.5 h-3.5" />
                    </button>
                    <button
                      type="button"
                      onClick={() => setTheme('dark')}
                      className={`p-1.5 rounded-full transition-all ${theme === 'dark' ? 'bg-indigo-600 text-white shadow-xs' : 'text-slate-400 hover:text-slate-200'}`}
                      title="Mode Gelap"
                    >
                      <Moon className="w-3.5 h-3.5" />
                    </button>
                  </div>
                  <button onClick={() => setIsMobileMenuOpen(true)} className="text-slate-300 p-1.5 border border-slate-700 rounded-lg hover:bg-slate-800"><Menu className="w-5 h-5" /></button>
                </div>
              </header>
              {isMobileMenuOpen && (
                <div className="fixed inset-0 bg-[#0f172a]/80 z-50 md:hidden backdrop-blur-sm transition-opacity" onClick={() => setIsMobileMenuOpen(false)}>
                  <aside className="w-[280px] h-full bg-[#0f172a] text-white flex flex-col shadow-2xl animate-in slide-in-from-left-full relative border-r border-[#1e293b]" onClick={e => e.stopPropagation()}>
                    <div className="flex items-center justify-between min-h-[86px] py-3.5 border-b border-[#1e293b] px-5 bg-[#0f172a]"><div className="flex items-center"><div className="w-8 h-8 bg-white rounded flex items-center justify-center mr-2 shadow-lg shadow-white/10 p-1 overflow-hidden shrink-0">{appLogo ? <img src={appLogo} alt="Logo" className="w-full h-full object-contain" /> : <ImageIcon className="w-4 h-4 text-slate-300" />}</div><div className="flex flex-col"><span className="text-white font-extrabold text-sm tracking-tight">Portal Procurement</span><span className="text-slate-400 font-semibold text-[10px] uppercase tracking-widest mt-0.5">SJA Sukodono • v2.5</span><div className="flex items-center gap-1.5 mt-1.5"><span className="relative flex h-2 w-2"><span className="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span><span className="relative inline-flex rounded-full h-2 w-2 bg-emerald-500 shadow-[0_0_8px_rgba(16,185,129,0.9)]"></span></span><span className="text-[10.5px] font-bold text-emerald-400 tracking-wide">Status Online</span></div></div></div><button onClick={() => setIsMobileMenuOpen(false)} className="text-slate-400 hover:text-white bg-slate-800 p-1.5 rounded-lg border border-slate-700"><X className="w-4 h-4" /></button></div>
                    <nav className="flex-1 overflow-y-auto py-6 px-3 space-y-1.5 pb-24">
                      <button onClick={() => { setActiveTab('dashboard'); setIsMobileMenuOpen(false); }} className={navItemClass(activeTab === 'dashboard')}><LayoutDashboard className="w-4 h-4 mr-3" /> Dashboard Harga</button>
                      <button onClick={() => { setActiveTab('input'); setIsMobileMenuOpen(false); }} className={navItemClass(activeTab === 'input')}><Database className="w-4 h-4 mr-3" /> Input Penawaran</button>
                      <button onClick={() => { setActiveTab('update-pembelian'); setIsMobileMenuOpen(false); }} className={navItemClass(activeTab === 'update-pembelian')}><ShoppingCart className="w-4 h-4 mr-3" /> Dashboard G-Sheet</button>
                      <button onClick={() => { window.open('https://procurementsja3.github.io/sistem-pengajuan/', '_blank'); }} className={navItemClass(false)}><ClipboardList className="w-4 h-4 mr-3" /> Pengajuan Persediaan</button>
                      <button onClick={() => { window.open('https://procurementsja3.github.io/spp-monitoring-sja/', '_blank'); }} className={navItemClass(false)}><CheckCircle2 className="w-4 h-4 mr-3" /> Realisasi SPP</button>
                      {userRole === 'admin' && (
                        <>
                          <span className="px-4 text-[10px] font-extrabold text-slate-500 uppercase tracking-widest block mb-2 mt-4">Monitoring Sistem</span>
                          <button onClick={() => { window.open('https://gemini.google.com/share/9ef62681fb8c?skid=ac242023-3f8b-433a-a599-e91fc708e58d', '_blank'); }} className={navItemClass(false)}><Droplet className="w-4 h-4 mr-3" /> Solar</button>
                          <button onClick={() => { window.open('https://gemini.google.com/share/2d8ea2848468', '_blank'); }} className={navItemClass(false)}><Package className="w-4 h-4 mr-3" /> Pallet Kayu</button>
                          <button onClick={() => { window.open('https://gemini.google.com/share/cc921c59e922', '_blank'); }} className={navItemClass(false)}><Truck className="w-4 h-4 mr-3" /> Kedatangan Barang</button>
                          <button onClick={() => { window.open('https://gemini.google.com/share/5c6cfda5125a', '_blank'); }} className={navItemClass(false)}><ClipboardList className="w-4 h-4 mr-3" /> Kontrak Vendor</button>
                          <span className="px-4 text-[10px] font-extrabold text-slate-500 uppercase tracking-widest block mb-2 mt-4">Lainnya</span><button onClick={() => { setActiveTab('sop-wi'); setIsMobileMenuOpen(false); }} className={navItemClass(activeTab === 'sop-wi')}><BookOpen className="w-4 h-4 mr-3" /> SOP & Instruksi Kerja</button><button onClick={() => { setActiveTab('form'); setIsMobileMenuOpen(false); }} className={navItemClass(activeTab === 'form')}><FileText className="w-4 h-4 mr-3" /> Form Standar</button><button onClick={() => { setActiveTab('seleksi-supplier'); setIsMobileMenuOpen(false); }} className={navItemClass(activeTab === 'seleksi-supplier')}><Users className="w-4 h-4 mr-3" /> Seleksi Supplier</button><button onClick={() => { setActiveTab('evaluasi-supplier'); setIsMobileMenuOpen(false); }} className={navItemClass(activeTab === 'evaluasi-supplier')}><CheckCircle2 className="w-4 h-4 mr-3" /> Evaluasi Supplier</button><button onClick={() => { setActiveTab('backup-restore-dokumen'); setIsMobileMenuOpen(false); }} className={navItemClass(activeTab === 'backup-restore-dokumen')}><Database className="w-4 h-4 mr-3" /> Backup & Restore Dokumen</button></>
                      )}
                    </nav>
                    <div className="absolute bottom-0 left-0 right-0 p-4 border-t border-[#1e293b] bg-[#0f172a] space-y-2.5">
                      <div className="p-2 rounded-xl bg-slate-800/80 border border-slate-700/80 flex items-center justify-between">
                        <div className="flex items-center gap-2">
                          {theme === 'dark' ? <Moon className="w-4 h-4 text-indigo-400" /> : <Sun className="w-4 h-4 text-amber-400" />}
                          <span className="text-xs font-bold text-slate-300">Mode Mata</span>
                        </div>
                        <div className="flex items-center p-0.5 rounded-lg bg-slate-900 border border-slate-700">
                          <button 
                            type="button"
                            onClick={() => setTheme('light')}
                            className={`px-2 py-0.5 rounded text-[11px] font-bold transition-all ${theme === 'light' ? 'bg-white text-slate-900 shadow' : 'text-slate-400'}`}
                          >
                            Terang
                          </button>
                          <button 
                            type="button"
                            onClick={() => setTheme('dark')}
                            className={`px-2 py-0.5 rounded text-[11px] font-bold transition-all ${theme === 'dark' ? 'bg-indigo-600 text-white shadow' : 'text-slate-400'}`}
                          >
                            Gelap
                          </button>
                        </div>
                      </div>
                      <button onClick={() => { handleLogout(); setIsMobileMenuOpen(false); }} className="w-full flex items-center justify-center px-4 py-2.5 rounded-xl bg-slate-800 text-slate-300 border border-slate-700 text-xs font-bold"><LogOut className="w-4 h-4 mr-2" /> Akhiri Sesi</button>
                    </div>
                  </aside>
                </div>
              )}

              <div className="flex-1 flex flex-col min-w-0 overflow-hidden bg-[#f8fafc]">
                {/* Desktop Top Header Bar dengan tombol Toggle In / Out */}
                <header className="hidden md:flex items-center justify-between px-6 py-2.5 bg-white dark:bg-[#0f172a] border-b border-slate-200/80 dark:border-slate-800/80 z-10 shadow-2xs transition-colors">
                  <div className="flex items-center gap-3">
                    <button
                      type="button"
                      id="btn-toggle-sidebar-top"
                      onClick={handleToggleSidebar}
                      className={`flex items-center gap-2 px-3 py-1.5 rounded-xl text-xs font-bold transition-all border shadow-2xs group cursor-pointer ${
                        isSidebarOpen 
                          ? 'bg-slate-50 hover:bg-slate-100 text-slate-700 border-slate-200 hover:border-slate-300 dark:bg-slate-800 dark:hover:bg-slate-700 dark:text-slate-200 dark:border-slate-700' 
                          : 'bg-indigo-50 hover:bg-indigo-100 text-indigo-700 border-indigo-200 hover:border-indigo-300 ring-2 ring-indigo-500/20 dark:bg-indigo-950/60 dark:text-indigo-300 dark:border-indigo-800'
                      }`}
                      title={isSidebarOpen ? "Ciutkan Sidebar (Toggle Out)" : "Tampilkan Sidebar (Toggle In)"}
                    >
                      {isSidebarOpen ? (
                        <>
                          <ChevronLeft className="w-4 h-4 text-slate-500 dark:text-slate-400 group-hover:text-slate-800 dark:group-hover:text-white transition-transform group-hover:-translate-x-0.5" />
                          <span>Ciutkan Menu</span>
                        </>
                      ) : (
                        <>
                          <Menu className="w-4 h-4 text-indigo-600 dark:text-indigo-400" />
                          <span className="font-extrabold text-indigo-700 dark:text-indigo-300">Buka Menu Sidebar</span>
                        </>
                      )}
                    </button>

                    <div className="h-4 w-px bg-slate-200 dark:bg-slate-700 mx-1"></div>

                    <div className="flex items-center gap-2 text-xs">
                      <span className="font-semibold text-slate-400 dark:text-slate-500">Portal</span>
                      <span className="text-slate-300 dark:text-slate-600">/</span>
                      <span className="font-bold text-slate-700 dark:text-slate-200">
                        {activeTab === 'dashboard' ? 'Analisis Harga & Summary' :
                         activeTab === 'input' ? 'Input Penawaran Vendor' :
                         activeTab === 'update-pembelian' ? 'Data Pembelian Live' :
                         activeTab === 'sop-wi' ? 'SOP & Instruksi Kerja' :
                         activeTab === 'form' ? 'Form Standar' :
                         activeTab === 'seleksi-supplier' ? 'Seleksi Supplier' :
                         activeTab === 'evaluasi-supplier' ? 'Evaluasi Supplier' :
                         activeTab === 'backup-restore-dokumen' ? 'Backup & Restore Dokumen' : activeTab}
                      </span>
                    </div>
                  </div>

                  <div className="flex items-center gap-2.5">
                    {/* Jam Digital & Tanggal Sistem Realtime - Desain Elegan, Jelas & Berkilau di Dark Mode */}
                    <div 
                      id="digital-clock-container"
                      className="flex items-center gap-2 sm:gap-3 px-3 py-1.5 rounded-full bg-white/95 dark:bg-slate-900/95 hover:bg-slate-50 dark:hover:bg-slate-850 border border-slate-200/90 dark:border-slate-700/90 shadow-[0_1px_3px_0_rgba(15,23,42,0.04)] dark:shadow-[0_0_15px_rgba(0,0,0,0.5)] transition-all select-none group"
                      title="Waktu dan Tanggal Sistem Realtime"
                    >
                      <div className="hidden md:flex items-center gap-1.5 text-xs font-medium text-slate-600 dark:text-slate-300 clock-date">
                        <Calendar className="w-3.5 h-3.5 text-blue-600 dark:text-sky-400 shrink-0" />
                        <span className="tracking-tight">{formattedDate}</span>
                      </div>

                      <span className="hidden md:inline-block w-px h-3.5 bg-slate-200/90 dark:bg-slate-700"></span>

                      <div className="flex items-center gap-1.5 font-mono text-xs tabular-nums">
                        <span className="relative flex h-2 w-2 mr-0.5">
                          <span className="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                          <span className="relative inline-flex rounded-full h-2 w-2 bg-emerald-500 shadow-[0_0_8px_rgba(16,185,129,0.9)]"></span>
                        </span>
                        <span className="font-extrabold text-slate-900 dark:text-white tracking-tight clock-time text-[13px]">{timeParts.hours}:{timeParts.minutes}</span>
                        <span className="text-[11px] font-bold text-slate-400 dark:text-sky-400 clock-seconds">:{timeParts.seconds}</span>
                        <span className="text-[9px] font-sans font-extrabold tracking-wider px-1.5 py-0.5 rounded bg-slate-100/90 dark:bg-slate-800 text-slate-500 dark:text-sky-300 border border-slate-200/70 dark:border-sky-500/40 leading-none ml-0.5 clock-wib shadow-2xs">WIB</span>
                      </div>
                    </div>

                    {/* Tombol Pilihan 2 Mode: Terang & Gelap (Kenyamanan Mata) */}
                    <div 
                      className="flex items-center p-0.5 rounded-full bg-slate-100 dark:bg-slate-800 border border-slate-200/90 dark:border-slate-700 shadow-2xs select-none"
                      title="Pilihan Mode Tampilan untuk Kenyamanan Mata"
                    >
                      <button
                        type="button"
                        onClick={() => setTheme('light')}
                        className={`flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-bold transition-all cursor-pointer ${
                          theme === 'light'
                            ? 'bg-white text-amber-600 shadow-xs ring-1 ring-slate-200/80 font-extrabold'
                            : 'text-slate-500 hover:text-slate-800 dark:text-slate-400 dark:hover:text-slate-200'
                        }`}
                        title="Mode Terang (Light Mode)"
                      >
                        <Sun className={`w-3.5 h-3.5 ${theme === 'light' ? 'text-amber-500 fill-amber-500/20' : 'text-slate-400'}`} />
                        <span>Terang</span>
                      </button>

                      <button
                        type="button"
                        onClick={() => setTheme('dark')}
                        className={`flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-bold transition-all cursor-pointer ${
                          theme === 'dark'
                            ? 'bg-indigo-600 text-white shadow-xs font-extrabold'
                            : 'text-slate-500 hover:text-slate-800 dark:text-slate-400 dark:hover:text-slate-200'
                        }`}
                        title="Mode Gelap untuk Kenyamanan Mata (Dark Mode)"
                      >
                        <Moon className={`w-3.5 h-3.5 ${theme === 'dark' ? 'text-white fill-white/20' : 'text-slate-400'}`} />
                        <span>Gelap</span>
                      </button>
                    </div>

                    <span className="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-[11px] font-bold bg-slate-50 text-slate-600 border border-slate-200/80">
                      <span className="w-2 h-2 rounded-full bg-emerald-500"></span>
                      {userRole === 'admin' ? 'Administrator Portal' : 'User Tamu'}
                    </span>
                  </div>
                </header>

                <main className="flex-1 overflow-y-auto p-4 md:p-8 lg:px-10 relative scrollbar-thin scrollbar-thumb-slate-200">
                  {activeTab === 'dashboard' ? <DashboardView data={data} isLoading={isLoadingData} onEdit={handleEditProject} onDelete={handleDeleteProject} sheetData={sheetData} persistentFilters={persistentFilters} setPersistentFilters={setPersistentFilters} /> : 
                   activeTab === 'input' ? <InputDataView onAddData={handleAddData} isSaving={isSaving} data={data} editData={projectToEdit} onCancelEdit={() => { setProjectToEdit(null); setActiveTab('dashboard'); }} userRole={userRole} /> : 
                   activeTab === 'sop-wi' ? <DocumentManagerView user={user} userRole={userRole} docType="sop" /> : 
                   activeTab === 'form' ? <DocumentManagerView user={user} userRole={userRole} docType="form" /> : 
                   activeTab === 'seleksi-supplier' ? <DocumentManagerView user={user} userRole={userRole} docType="seleksi" /> : 
                   activeTab === 'evaluasi-supplier' ? <DocumentManagerView user={user} userRole={userRole} docType="evaluasi" /> : 
                   activeTab === 'backup-restore-dokumen' ? <GlobalDocumentBackupView user={user} userRole={userRole} /> : 
                   <UpdatePembelianView sheetData={sheetData} isLoading={isSheetLoading} errorMsg={sheetErrorMsg} availableMonths={sheetAvailableMonths} availableYears={sheetAvailableYears} fetchSheetData={fetchSheetData} persistentFilters={persistentFilters} setPersistentFilters={setPersistentFilters} />}
                </main>
              </div>
            </div>
          );
        }

        const root = createRoot(document.getElementById('root'));
        root.render(<PriceComparisonApp />);
    </script>
</body>
</html>
